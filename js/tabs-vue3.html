<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>tabs-vue3</title>
  <style>
    .tab-list {
      display: flex;
      list-style: none;
      padding: 0;
    }

    .active button {
      background-color: aqua;
    }
  </style>
</head>

<body>
  <div id="app"></div>
  <script type="module">
    import { createApp } from 'https://unpkg.com/vue@3/dist/vue.esm-browser.js'
    let app = createApp({
      template: /*html*/`
      <div>
        <tabs activeKey="2" :items="itemssssssssss"></tabs>
      </div>
      `,
      data() {
        return {
          itemssssssssss: [
            {
              key: '1',
              label: 'Tab 1',
              children: 'Content of Tab Pane 1',
            },
            {
              key: '2',
              label: 'Tab 2',
              children: 'Content of Tab Pane 2',
            },
            {
              key: '3',
              label: 'Tab 3',
              children: 'Content of Tab Pane 3',
            },
          ],
        }
      },
      methods: {

      },
      computed: {

      }
    })
    app.component('tabs', {
      props: {
        items: {
          type: Array,
          required: true,
        },
        activeKey: {
          type: String,
          default: "1",
        },
      },
      template: /*html*/`
        <ul class="tab-list">
          <li v-for="(item, index) in items" :key="item.key" :class="{active : currentKey === item.key}">
            <button @click="change(item.key)">{{ item.label }}</button>
          </li>
        </ul>
        <div>
          {{ currentContent }}
        </div>     
      `,
      data() {
        return {
          currentKey: this.activeKey
        }
      },
      methods: {
        change(key) {
          if (key !== this.currentKey) {
            this.currentKey = key
          }
        }
      },
      computed: {
        currentContent() {
          let target = this.items.find((item, i) => {
            return this.currentKey === item.key
          });
          return target ? target.children : ''
        }
      },



    })
    app.mount('#app')
  </script>
</body>

</html>
